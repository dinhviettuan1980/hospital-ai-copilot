# ---------------------------------------------------------------------------
# Hospital AI Copilot — hospital-backend
# Sprint 1: Mini HIS prototype (Department / Patient / Visit)
# Sprint 2: Executive Dashboard, Command Center, AI Director (demo), Knowledge Center
# Sprint D1: Hospital Discovery (survey/questionnaire module)
# ---------------------------------------------------------------------------

# --- Datasource ---------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:hospital}
quarkus.datasource.password=${DB_PASSWORD:hospital}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}

# --- Hibernate ORM --------------------------------------------------------
# 'update' keeps Sprint 1 simple (no migration tool introduced yet).
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
# Batches sequential inserts (e.g. Discovery survey import/seed, ~200 answer rows)
# into fewer round-trips — meaningful against a remote database.
quarkus.hibernate-orm.jdbc.statement-batch-size=50

# --- HTTP ------------------------------------------------------------------
quarkus.http.port=8080

# --- CORS (frontend runs on a different origin during local dev) ---------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# --- OpenAPI / Swagger UI --------------------------------------------------
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# --- Health ------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health

# --- Seed data --------------------------------------------------------
# Disabled automatically in the "test" profile so unit tests never touch a database.
hospital.seed.enabled=${SEED_ENABLED:true}
%test.hospital.seed.enabled=false

# --- Jackson ----------------------------------------------------------
quarkus.jackson.fail-on-unknown-properties=false

# --- Knowledge Center file storage -----------------------------------
# Local filesystem only in this sprint — no object storage, no Docker volume.
hospital.knowledge.storage-path=${KNOWLEDGE_STORAGE_PATH:./data/knowledge-uploads}
quarkus.http.limits.max-body-size=25M

# --- Hospital Discovery attachment storage -----------------------------
hospital.discovery.storage-path=${DISCOVERY_STORAGE_PATH:./data/discovery-attachments}
